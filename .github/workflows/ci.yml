name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + lint + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gestao_edu_test
        ports:
          - 3052:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:3052/gestao_edu_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:3052/gestao_edu_test?schema=public
      JWT_SECRET: ci-segredo-apenas-para-testes-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências (workspace)
        run: npm ci
        working-directory: .
      - name: Gerar Prisma Client
        run: npx prisma generate
      - name: Build (tsc)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Testes (vitest)
        run: npm test

  dashboard:
    name: Dashboard (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3051
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências (workspace)
        run: npm ci
        working-directory: .
      - name: Testes (vitest)
        run: npm test
      - name: Build (next)
        run: npm run build

  mobile:
    name: Mobile (typecheck + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  imagens:
    name: Imagens Docker de produção (build)
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -f backend/Dockerfile -t gestao-edu-backend:ci .
      - name: Build dashboard
        run: docker build -f dashboard/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.exemplo.invalid -t gestao-edu-dashboard:ci .
